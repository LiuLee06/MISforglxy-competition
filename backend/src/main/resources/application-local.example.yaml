# 本地开发配置示例
# 使用时请复制到 backend/application-local.yaml，并替换为实际值。
# 该文件通过启动参数 additional-location 加载。

spring:
  datasource:
    url: jdbc:mysql://YOUR_CLOUD_DB_HOST:3306/YOUR_DATABASE_NAME?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&useServerPrepStmts=true
    username: YOUR_DB_USERNAME
    password: YOUR_DB_PASSWORD

ai:
  provider: mock
  agent:
    enabled: true
  time-zone: Asia/Shanghai
  # 如果使用 DeepSeek，请通过环境变量或本地配置覆盖以下值。
  deepseek:
    base-url: https://api.deepseek.com
    api-key: YOUR_DEEPSEEK_API_KEY
    model: YOUR_DEEPSEEK_MODEL
    thinking-enabled: false
    timeout-seconds: 60

# 成果管理模块专用数据源（本地库 achievement_system）
# 建库脚本见 backend/SQL/achievement_system.sql
achievement:
  datasource:
    url: jdbc:mysql://YOUR_DB_HOST:3306/achievement_system?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&useServerPrepStmts=true
    username: YOUR_DB_USERNAME
    password: YOUR_DB_PASSWORD
