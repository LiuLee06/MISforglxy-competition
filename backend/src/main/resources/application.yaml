spring:
  application:
    name: college-manage-system
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 1000MB
      file-size-threshold: 2KB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
server:
  port: 8888
# 附件存储目录:本地开发默认 ./uploads/(即 jar 启动目录下的 uploads);
# 部署时改为服务器绝对路径,如 /opt/app/uploads/,上传的附件文件都存放在该目录下
file:
  upload-path: ./uploads/
#  servlet:
#    context-path: /api
mybatis:
  mapper-locations: classpath*:mapper/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true #驼峰命名



ai:
  provider: ${AI_PROVIDER:mock}
  time-zone: ${AI_TIME_ZONE:Asia/Shanghai}
  agent:
    enabled: ${AI_AGENT_ENABLED:true}
    max-history-messages: ${AI_MAX_HISTORY_MESSAGES:20}
    max-tool-iterations: ${AI_MAX_TOOL_ITERATIONS:6}
    max-tool-calls: ${AI_MAX_TOOL_CALLS:8}
  deepseek:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    thinking-enabled: ${DEEPSEEK_THINKING_ENABLED:false}
    timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:60}
    max-output-tokens: ${DEEPSEEK_MAX_OUTPUT_TOKENS:1536}
  knowledge:
    max-file-size-mb: ${AI_KNOWLEDGE_MAX_FILE_SIZE_MB:20}
    processing:
      chunk-chars: ${AI_KNOWLEDGE_CHUNK_CHARS:2000}
      summary-chars: ${AI_KNOWLEDGE_SUMMARY_CHARS:8000}

# ===== 成果管理模块专用数据源 =====
# 成果数据存放在独立的本地库 achievement_system，与上面 spring.datasource 指向的
# 业务主库相互隔离：成果表只在该库中读写，不会动原有任何库表。
# 连接信息通过环境变量或 application-local.yaml（本地、不入库）提供，不在主配置中写死。
achievement:
  datasource:
    url: ${ACHIEVEMENT_DB_URL}
    username: ${ACHIEVEMENT_DB_USERNAME}
    password: ${ACHIEVEMENT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

